# The pipeline. Each stage lists its command, what it depends on (deps, params)
# and what it produces (outs). `dvc repro` runs a stage only if one of its
# dependencies changed since the last run.

stages:
  download:
    cmd: python scripts/download_fleurs.py
    deps:
      - scripts/download_fleurs.py
    params:
      - data.languages
      - data.splits
    outs:
      - data/raw/fleurs

  align:
    cmd: python scripts/align_words.py
    deps:
      - scripts/align_words.py
      - data/raw/fleurs
    params:
      - audio.sample_rate
    outs:
      - data/interim/alignments.jsonl

  build_dataset:
    cmd: python scripts/build_dataset.py
    deps:
      - scripts/build_dataset.py
      - src/indic_eot/dataset.py
      - data/interim/alignments.jsonl
    params:
      - seed
      - audio
      - dataset
    outs:
      - data/processed/eot
    metrics:
      - results/dataset_stats.json:
          cache: false

  validate:
    cmd: python scripts/validate_dataset.py
    deps:
      - scripts/validate_dataset.py
      - data/processed/eot
    params:
      - audio
      - validation
    metrics:
      - results/validation.json:
          cache: false

  shortcut_check:
    cmd: python scripts/shortcut_check.py
    deps:
      - scripts/shortcut_check.py
      - data/processed/eot
      - results/validation.json
    params:
      - shortcut_check
    metrics:
      - results/shortcut_check.json:
          cache: false

  train_audio:
    cmd: python scripts/train_audio.py
    deps:
      - scripts/train_audio.py
      - src/indic_eot/audio_model.py
      - src/indic_eot/training.py
      - data/processed/eot
      - results/shortcut_check.json
    params:
      - seed
      - audio
      - train_audio
    outs:
      - models/audio/model.pt
      - results/audio_predictions.csv
    metrics:
      - results/audio_metrics.json:
          cache: false

  train_text:
    cmd: python scripts/train_text.py
    deps:
      - scripts/train_text.py
      - src/indic_eot/text_model.py
      - src/indic_eot/evaluation.py
      - src/indic_eot/training.py
      - data/processed/eot
    params:
      - seed
      - train_text
    outs:
      - models/text
      - results/text_predictions.csv
    metrics:
      - results/text_metrics.json:
          cache: false

  fuse:
    cmd: python scripts/fuse.py
    deps:
      - scripts/fuse.py
      - src/indic_eot/evaluation.py
      - data/processed/eot/metadata.csv
      - results/audio_predictions.csv
      - results/text_predictions.csv
    outs:
      - results/fusion_predictions.csv
      - models/fusion.json:
          cache: false
    metrics:
      - results/fusion_metrics.json:
          cache: false

  stream_points:
    cmd: python scripts/stream_points.py
    deps:
      - scripts/stream_points.py
      - src/indic_eot/streaming.py
      - src/indic_eot/audio_model.py
      - src/indic_eot/text_model.py
      - data/interim/alignments.jsonl
      - data/raw/fleurs
      - models/audio/model.pt
      - models/text
      - models/fusion.json
    params:
      - audio
      - dataset.splits
      - dataset.min_words
      - dataset.min_align_score
      - streaming.min_silence_ms
      - train_audio.encoder
    outs:
      - results/stream_points.csv

  baseline_smart_turn:
    cmd: python scripts/baseline_smart_turn.py
    deps:
      - scripts/baseline_smart_turn.py
      - src/indic_eot/streaming.py
      - data/interim/alignments.jsonl
      - data/raw/fleurs
    params:
      - audio.sample_rate
      - baselines.smart_turn
      - dataset.splits
      - dataset.min_words
      - dataset.min_align_score
      - streaming.min_silence_ms
    outs:
      - results/baseline_points.csv

  simulate:
    cmd: python scripts/simulate.py
    deps:
      - scripts/simulate.py
      - results/stream_points.csv
      - results/baseline_points.csv
    params:
      - seed
      - streaming
    metrics:
      - results/streaming_metrics.json:
          cache: false
    plots:
      - results/streaming_tradeoff.png:
          cache: false
