# The pipeline. Each stage lists its command, what it depends on (deps, params)
# and what it produces (outs). `dvc repro` runs a stage only if one of its
# dependencies changed since the last run.

stages:
  download:
    cmd: python scripts/download_fleurs.py
    deps:
      - scripts/download_fleurs.py
    params:
      - data.languages
      - data.splits
    outs:
      - data/raw/fleurs

  align:
    cmd: python scripts/align_words.py
    deps:
      - scripts/align_words.py
      - data/raw/fleurs
    params:
      - audio.sample_rate
    outs:
      - data/interim/alignments.jsonl

  build_dataset:
    cmd: python scripts/build_dataset.py
    deps:
      - scripts/build_dataset.py
      - src/indic_eot/dataset.py
      - data/interim/alignments.jsonl
    params:
      - seed
      - audio
      - dataset
    outs:
      - data/processed/eot
    metrics:
      - results/dataset_stats.json:
          cache: false

  validate:
    cmd: python scripts/validate_dataset.py
    deps:
      - scripts/validate_dataset.py
      - data/processed/eot
    params:
      - audio
      - validation
    metrics:
      - results/validation.json:
          cache: false

  shortcut_check:
    cmd: python scripts/shortcut_check.py
    deps:
      - scripts/shortcut_check.py
      - data/processed/eot
      - results/validation.json
    params:
      - shortcut_check
    metrics:
      - results/shortcut_check.json:
          cache: false
