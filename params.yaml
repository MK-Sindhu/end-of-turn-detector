# Every tunable setting lives here. Scripts read this file; nothing is hard-coded.
# DVC watches it, so changing a value re-runs only the pipeline stages that use it.

seed: 42

audio:
  sample_rate: 16000   # Hz; everything is resampled to this
  max_seconds: 8.0     # the model looks at the last 8 s of speech

data:
  languages: [hi_in]            # FLEURS language codes; start with Hindi only
  splits: [train, dev, test]    # FLEURS splits to download (train is 1.3 GB)

dataset:
  splits:                    # our split name: which FLEURS splits feed it
    train: [train]
    val: [dev]
    test: [test]
  min_words: 6               # drop source clips shorter than this
  min_align_score: 0.7       # drop clips whose word timings look unreliable
  min_gap_ms: 200            # a silence this long counts as a natural pause
  max_pauses_per_clip: 4     # use at most this many pauses from one recording
  min_words_in_example: 2    # every example contains at least this many words
  tail_ms_range: [150, 400]  # how much of the real silence after the last word is kept
  tail_guard_ms: 50          # stay this far away from the next word

validation:
  max_class_imbalance: 0.02  # each split/language must be within 2% of a 50/50 split
  min_seconds: 0.3           # shortest clip allowed (two short words plus silence)

shortcut_check:
  must_be_chance: [length]   # feature groups that must carry no signal
  max_auroc: 0.55            # limit for those groups (0.5 = guessing)

train_audio:
  encoder: openai/whisper-tiny  # pretrained speech encoder (8M parameters)
  epochs: 6
  batch_size: 32
  num_workers: 4          # processes preparing audio in parallel
  lr_encoder: 5.0e-5      # small: the encoder is pretrained, only nudge it
  lr_head: 1.0e-3         # larger: the classifier head starts from scratch
  weight_decay: 0.01
  warmup_fraction: 0.1    # ramp the learning rate up over the first 10% of steps
  dropout: 0.1
  augment:
    gain_db: 6            # random volume change of up to +/- 6 dB
    noise_prob: 0.5       # half the training clips get background noise
    snr_db_range: [10, 40]  # how loud that noise is relative to the speech

mlflow:
  experiment: indic-eot

train_text:
  encoder: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2  # small multilingual transformer
  epochs: 5
  batch_size: 32
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1

streaming:
  min_silence_ms: 200        # quiet time before the model is asked
  fallback_ms: 1500          # respond anyway after this much quiet
  silence_timeouts_ms: [300, 500, 700, 1000, 1500]  # plain-timeout baselines
  report_thresholds: [0.5, 0.7, 0.9]  # model thresholds shown in the results table
  hesitation:                # ASSUMED lengths of mid-sentence thinking pauses
    median_ms: 500
    sigma: 0.6               # spread (log-normal): about 12% of pauses exceed 1 s

baselines:
  smart_turn:                       # existing open audio turn detector (BSD-2)
    repo: pipecat-ai/smart-turn-v3
    file: smart-turn-v3.2-gpu.onnx  # the full-precision version (32 MB)
