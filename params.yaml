# Every tunable setting lives here. Scripts read this file; nothing is hard-coded.
# DVC watches it, so changing a value re-runs only the pipeline stages that use it.

seed: 42

audio:
  sample_rate: 16000   # Hz; everything is resampled to this
  max_seconds: 8.0     # the model looks at the last 8 s of speech

data:
  languages: [hi_in]            # FLEURS language codes; start with Hindi only
  splits: [train, dev, test]    # FLEURS splits to download (train is 1.3 GB)

dataset:
  splits:                    # our split name: which FLEURS splits feed it
    train: [train]
    val: [dev]
    test: [test]
  min_words: 6               # drop source clips shorter than this
  min_align_score: 0.7       # drop clips whose word timings look unreliable
  examples_per_class: 2      # complete and incomplete examples made per source clip
  min_words_before_cut: 3    # an incomplete example contains at least this many words
  min_gap_ms: 60             # only cut where the speaker left at least this gap
  tail_ms_range: [150, 400]  # silence after the speech, picked at random per example

validation:
  max_class_imbalance: 0.02  # each split/language must be within 2% of a 50/50 split
  min_seconds: 0.5           # shortest clip allowed

shortcut_check:
  must_be_chance: [length, tail]  # feature groups that must carry no signal
  max_auroc: 0.55                 # limit for those groups (0.5 = guessing)
  real_pause_ms: 250              # incomplete clips cut at a gap at least this long
  connected_speech_ms: 80         # incomplete clips cut at a gap at most this long
