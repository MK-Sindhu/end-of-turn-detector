[project]
name = "indic-eot"
version = "0.1.0"
description = "End-of-turn detection for Indian and code-switched speech"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core: all that is needed to RUN the exported model.
dependencies = ["numpy", "onnxruntime"]

[project.optional-dependencies]
# The web service (what gets deployed).
serve = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "soundfile",
    "scipy",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]
# Everything needed to build the dataset and train. Installed by default with
# `uv sync`, left out of the deployed service.
train = [
    "scipy",
    "soundfile",
    "pyyaml",
    "tqdm",
    "scikit-learn",
    "torch",
    "transformers",
    "datasets",
    "onnx",
    "mlflow",
    "dvc",
    "torchaudio>=2.11.1",
    "uroman>=1.3.1.1",
    "indic-eot[serve]",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_eot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
